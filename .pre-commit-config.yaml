# Runs two of CI's checks before each commit: ruff's syntax-error and undefined-name rules, and
# the command registry test (#27). Set up with `pre-commit install` in the virtualenv that has
# requirements.txt and requirements-dev.txt installed.
#
# language: unsupported (pre-commit's name for `system` since 4.4.0) runs each hook from the
# active environment, so the hooks use the ruff and pytest that requirements-dev.txt pins and the
# bot's own dependencies, which the registry test imports.
minimum_pre_commit_version: "4.4.0"
repos:
  - repo: local
    hooks:
      - id: ruff-syntax
        name: ruff (syntax errors and undefined names)
        entry: ruff check --select E9,F63,F7,F82
        language: unsupported
        types: [python]
      - id: registry-test
        name: command registry test
        entry: pytest -q tests/test_registry.py
        language: unsupported
        types: [python]
        pass_filenames: false
