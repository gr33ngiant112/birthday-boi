name: CI

on:
  pull_request:
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies (wheels only)
        run: |
          python -m pip install --only-binary :all: -r requirements.txt -r requirements-dev.txt
      - name: Lint (syntax errors and undefined names)
        run: ruff check --select E9,F63,F7,F82 .
      - name: Test
        run: pytest -q

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

  dependency-scan:
    name: Dependency scan (osv-scanner)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies (wheels only)
        run: |
          python -m pip install --only-binary :all: -r requirements.txt -r requirements-dev.txt
      # Scan the versions pip actually installed; requirements.txt leaves most of them unpinned.
      # --all keeps setuptools (spaCy 3.5 needs it at runtime); pip is the installer, not a dependency.
      - name: Freeze resolved dependencies
        run: python -m pip freeze --all --exclude pip > pip-freeze.txt
      - name: Scan resolved dependencies
        # Report-only: becomes blocking (drop continue-on-error) once the lockfile work (#17/#21, Phase 3) lands.
        continue-on-error: true
        uses: google/osv-scanner-action/osv-scanner-action@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
        with:
          # --no-resolve: the freeze is already the full set; resolving again adds packages
          # that pip skipped on Python 3.11 because of environment markers.
          scan-args: |-
            --lockfile=requirements.txt:pip-freeze.txt
            --no-resolve
