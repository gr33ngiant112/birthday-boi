name: CI

on:
  pull_request:
    # ready_for_review starts CI when a draft is marked ready; while a PR is a draft, every job is skipped.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # A new push to a PR cancels that PR's older run. A push to develop waits for the
  # running one instead of cancelling it, because cancelled runs email the owner.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Lint, test and build
    # Skipped while a PR is a draft. On a push, github.event.pull_request is null and
    # null == false is true (GitHub compares them as numbers), so pushes to develop run it.
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies (wheels only)
        run: |
          python -m pip install --only-binary :all: -r requirements.txt -r requirements-dev.txt
      - name: Lint (syntax errors and undefined names)
        run: ruff check --select E9,F63,F7,F82 .
      - name: Test
        run: pytest -q

  secret-scan:
    name: Secret scan (gitleaks)
    if: github.event.pull_request.draft == false # skipped while a PR is a draft, as above
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks reads the full history behind HEAD
          persist-credentials: false
      - name: Install gitleaks 8.30.1 (checksum-verified)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" \
            | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      # Scans every commit reachable from HEAD (on a PR, GitHub's merge commit), so no commit
      # range or PR size can leave commits out. --diff-merges=first-parent also scans what each
      # merge commit changes: plain `git log -p` shows no diff for merges, so a value added only
      # while resolving a merge conflict would otherwise go unscanned. The history was clean
      # when this was added. --redact keeps values out of the log; --verbose names the rule,
      # file, line and commit of each finding.
      - name: Scan the full history
        run: '"$RUNNER_TEMP/gitleaks" git --no-banner --redact --verbose --log-opts="--diff-merges=first-parent HEAD" .'

  dependency-scan:
    name: Dependency scan (osv-scanner)
    if: github.event.pull_request.draft == false # skipped while a PR is a draft, as above
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies (wheels only)
        run: |
          python -m pip install --only-binary :all: -r requirements.txt -r requirements-dev.txt
      # Scan the versions pip actually installed; requirements.txt leaves most of them unpinned.
      # --all keeps setuptools (spaCy 3.5 needs it at runtime); pip is the installer, not a dependency.
      - name: Freeze resolved dependencies
        run: python -m pip freeze --all --exclude pip > pip-freeze.txt
      - name: Scan resolved dependencies
        # Report-only: becomes blocking (drop continue-on-error) once the lockfile work (#17/#21, Phase 3) lands.
        continue-on-error: true
        uses: google/osv-scanner-action/osv-scanner-action@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
        with:
          # --no-resolve: the freeze is already the full set; resolving again adds packages
          # that pip skipped on Python 3.11 because of environment markers.
          # --no-ignore: osv-scanner 2.6.0 skips files that match a .gitignore pattern, even when named.
          scan-args: |-
            --lockfile=requirements.txt:pip-freeze.txt
            --no-resolve
            --no-ignore
