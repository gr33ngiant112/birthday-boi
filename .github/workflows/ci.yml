name: CI

on:
  pull_request:
    # ready_for_review starts CI when a draft is marked ready; while a PR is a draft, every job is skipped.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  # One group per PR, and one per commit pushed to develop. A new push to a PR cancels that
  # PR's older run; develop push runs never wait for or cancel each other, because cancelled
  # runs email the owner.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The two job names below are required status checks on develop and main. Renaming a job means
# updating both branches' protection in the same change, a GitHub admin step (the owner's for main).
jobs:
  build:
    name: Lint, test and build
    # Skipped while a PR is a draft. On a push, github.event.pull_request is null and
    # null == false is true (GitHub compares them as numbers), so pushes to develop run it.
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # CI builds the bot's Docker image and runs the lint and the tests inside it (#35).
      # docker build uses BuildKit here, and the test build reuses the first build's layers.
      # The image installs uv.lock with `uv sync --locked`, so this step fails when uv.lock does
      # not match pyproject.toml.
      - name: Build the bot's image
        run: docker build --tag birthday-boi .
      # The test image also has the dev packages, and fakeredis brings in redis, so a runtime
      # dependency missing from pyproject.toml could still pass the tests. Importing bot.py
      # here checks the bot's image on its own.
      - name: Import bot.py in the bot's image
        run: docker run --rm --network none birthday-boi python bot.py --help
      - name: Build the test image (the bot's image, the dev tools and the tests)
        run: docker build --target test --tag birthday-boi:test .
      - name: Lint and test in the test image
        run: docker run --rm --network none birthday-boi:test

  trivy:
    name: trivy
    if: github.event.pull_request.draft == false # skipped while a PR is a draft, as above
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install trivy 0.75.0 (checksum-verified)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/trivy.tar.gz" \
            https://github.com/aquasecurity/trivy/releases/download/v0.75.0/trivy_0.75.0_Linux-64bit.tar.gz
          echo "c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f  $RUNNER_TEMP/trivy.tar.gz" \
            | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/trivy.tar.gz" -C "$RUNNER_TEMP" trivy
      # A fixable MEDIUM, HIGH or CRITICAL vulnerability in uv.lock's packages, or any secret in a
      # committed file, fails the job.
      - name: Scan dependencies and secrets
        run: |
          "$RUNNER_TEMP/trivy" fs --scanners vuln --severity MEDIUM,HIGH,CRITICAL --ignore-unfixed --exit-code 1 --skip-dirs node_modules --skip-dirs .venv .
          "$RUNNER_TEMP/trivy" fs --scanners secret --exit-code 1 --skip-dirs node_modules --skip-dirs .venv .
