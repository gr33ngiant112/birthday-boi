name: CI

on:
  pull_request:
    # ready_for_review starts CI when a draft is marked ready; while a PR is a draft, every job is skipped.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  # One group per PR, and one per commit pushed to develop. A new push to a PR cancels that
  # PR's older run; develop push runs never wait for or cancel each other, because cancelled
  # runs email the owner.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The three job names below are required status checks on develop and main. Renaming a job means
# updating both branches' protection in the same change, a GitHub admin step (the owner's for main).
jobs:
  build:
    name: Lint, test and build
    # Skipped while a PR is a draft. On a push, github.event.pull_request is null and
    # null == false is true (GitHub compares them as numbers), so pushes to develop run it.
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # CI builds the bot's Docker image and runs the lint and the tests inside it (#35).
      # docker build uses BuildKit here, and the test build reuses the first build's layers.
      # The image installs uv.lock with `uv sync --locked`, so this step fails when uv.lock does
      # not match pyproject.toml.
      - name: Build the bot's image
        run: docker build --tag birthday-boi .
      # The test image also has the dev packages, and fakeredis brings in redis, so a runtime
      # dependency missing from pyproject.toml could still pass the tests. Importing bot.py
      # here checks the bot's image on its own.
      - name: Import bot.py in the bot's image
        run: docker run --rm --network none birthday-boi python bot.py --help
      - name: Build the test image (the bot's image, the dev tools and the tests)
        run: docker build --target test --tag birthday-boi:test .
      - name: Lint and test in the test image
        run: docker run --rm --network none birthday-boi:test

  secret-scan:
    name: Secret scan (gitleaks)
    if: github.event.pull_request.draft == false # skipped while a PR is a draft, as above
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks reads the full history behind HEAD
          persist-credentials: false
      - name: Install gitleaks 8.30.1 (checksum-verified)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" \
            | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      # Scans every commit reachable from HEAD (on a PR, GitHub's merge commit), so no commit
      # range or PR size can leave commits out. --diff-merges=first-parent also scans what each
      # merge commit changes: plain `git log -p` shows no diff for merges, so a value added only
      # while resolving a merge conflict would otherwise go unscanned. The history was clean
      # when this was added. --redact keeps values out of the log; --verbose names the rule,
      # file, line and commit of each finding.
      - name: Scan the full history
        run: '"$RUNNER_TEMP/gitleaks" git --no-banner --redact --verbose --log-opts="--diff-merges=first-parent HEAD" .'

  dependency-scan:
    name: Dependency scan (osv-scanner)
    if: github.event.pull_request.draft == false # skipped while a PR is a draft, as above
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # uv.lock pins every package the image and the tests install, the dev tools included, so
      # the scan reads it directly. Any known advisory fails the job, except those that
      # osv-scanner.toml ignores, each with its reason and an expiry date.
      - name: Scan uv.lock
        uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          # --no-ignore: osv-scanner 2.6.0 skips files that match a .gitignore pattern, even when named.
          scan-args: |-
            --lockfile=uv.lock
            --config=osv-scanner.toml
            --no-ignore
