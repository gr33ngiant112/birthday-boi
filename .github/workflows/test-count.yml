name: Test count

# Fails a pull request whose merge would leave fewer tests than its base branch has, unless the
# pull request has the tests-removed label (#27). It is a workflow of its own because adding or
# removing a label runs it again, and that should not run the whole CI.
on:
  pull_request:
    # ready_for_review starts the check when a draft is marked ready; while a PR is a draft, the job is skipped.
    # labeled and unlabeled run it again when the tests-removed label is added or removed.
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  # As in ci.yml, with a group of its own: a newer run for the same PR cancels the older one.
  group: test-count-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-count:
    name: Compare with the base branch
    if: github.event.pull_request.draft == false # skipped while a PR is a draft, as in ci.yml
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # A pull_request run checks out GitHub's merge of the PR into its base branch. Its first
      # parent, HEAD^1, is the base branch, so the comparison counts what merging would change.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2 # the merge commit and its parents
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # The Dockerfile's uv. Without a version, setup-uv installs the latest uv.
          version: "0.12.23"
      # uv.lock's packages, the dev group included, into .venv with Python 3.11 (.python-version),
      # from wheels only.
      - name: Install the locked dependencies (wheels only)
        run: uv sync --locked --no-build
      # The script collects the tests with the Python that runs it, so it runs with .venv's.
      - name: Compare the test count with the base branch
        env:
          TESTS_REMOVED_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'tests-removed') }}
        run: |
          args=()
          if [ "$TESTS_REMOVED_LABEL" = "true" ]; then
            args+=(--tests-removed-label)
          fi
          .venv/bin/python .github/scripts/compare_test_count.py "${args[@]}" HEAD^1 HEAD
