# Local development only (#28): a Redis for `python bot.py` on this machine.
#
#   docker compose -f compose.dev.yaml up -d
#   then, in .env: REDIS_URL=redis://127.0.0.1:6379/0
#
# The port is published on 127.0.0.1 only. REDIS_PORT picks another host port.
# `docker compose -f compose.dev.yaml down` stops Redis; add -v to delete its data.
services:
  redis:
    # The official Redis image, pinned to its digest. Dependabot bumps the tag and the digest together.
    image: redis:8.10-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data

volumes:
  redis-data:
